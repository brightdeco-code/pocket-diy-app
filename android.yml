name: Build Pocket DIY Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
          for f in manifest.webmanifest offline.html robots.txt service-worker.js; do
            if [ -f "$f" ]; then cp "$f" www/; fi
          done

      - name: Generate Android project
        run: |
          if [ ! -f android/gradlew ]; then npx cap add android; fi
          npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketDIY-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
